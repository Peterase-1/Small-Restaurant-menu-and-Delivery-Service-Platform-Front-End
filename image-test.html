<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Test - Sliding Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }

    .image-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }

    .image-item {
      border: 2px solid #ddd;
      padding: 10px;
      background: white;
      border-radius: 8px;
      text-align: center;
    }

    .image-item img {
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
    }

    .status {
      padding: 5px 10px;
      border-radius: 4px;
      margin: 5px 0;
      font-weight: bold;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
    }

    .loading {
      background-color: #fff3cd;
      color: #856404;
    }
  </style>
</head>

<body>
  <h1>🖼️ Sliding Images Test</h1>
  <p>Testing if all hero images are accessible:</p>

  <div class="image-container">
    <div class="image-item">
      <h3>Sliding Image 1</h3>
      <img src="Images/Home Page Hero/Sliding Image 1.png" alt="Sliding Image 1" onload="showStatus(this, 'success')"
        onerror="showStatus(this, 'error')">
      <div id="status1" class="status loading">Loading...</div>
    </div>

    <div class="image-item">
      <h3>Sliding Image 2</h3>
      <img src="Images/Home Page Hero/Sliding Image 2 (2).png" alt="Sliding Image 2"
        onload="showStatus(this, 'success')" onerror="showStatus(this, 'error')">
      <div id="status2" class="status loading">Loading...</div>
    </div>

    <div class="image-item">
      <h3>Sliding Image 3</h3>
      <img src="Images/Home Page Hero/Sliding Image 3 (2).png" alt="Sliding Image 3"
        onload="showStatus(this, 'success')" onerror="showStatus(this, 'error')">
      <div id="status3" class="status loading">Loading...</div>
    </div>

    <div class="image-item">
      <h3>Sliding Image 4</h3>
      <img src="Images/Home Page Hero/Sliding Image 4.png" alt="Sliding Image 4" onload="showStatus(this, 'success')"
        onerror="showStatus(this, 'error')">
      <div id="status4" class="status loading">Loading...</div>
    </div>
  </div>

  <div style="margin-top: 30px; padding: 20px; background: white; border-radius: 8px;">
    <h3>📋 Test Results:</h3>
    <ul id="results"></ul>
  </div>

  <div style="margin-top: 20px;">
    <a href="index.html"
      style="background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">
      🏠 Back to Restaurant
    </a>
  </div>

  <script>
    let loadedCount = 0;
    let totalImages = 4;

    function showStatus(img, status) {
      const imageName = img.alt;
      const statusDiv = document.getElementById('status' + (loadedCount + 1));

      if (status === 'success') {
        statusDiv.textContent = '✅ Loaded Successfully';
        statusDiv.className = 'status success';
        loadedCount++;
      } else {
        statusDiv.textContent = '❌ Failed to Load';
        statusDiv.className = 'status error';
      }

      updateResults();
    }

    function updateResults() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `
                <li>✅ Images loaded: ${loadedCount}/${totalImages}</li>
                <li>❌ Images failed: ${totalImages - loadedCount}/${totalImages}</li>
                <li>📊 Success rate: ${Math.round((loadedCount / totalImages) * 100)}%</li>
            `;

      if (loadedCount === totalImages) {
        resultsDiv.innerHTML += '<li style="color: green; font-weight: bold;">🎉 All images loaded successfully!</li>';
      } else if (loadedCount === 0) {
        resultsDiv.innerHTML += '<li style="color: red; font-weight: bold;">⚠️ No images loaded - check file paths!</li>';
      }
    }
  </script>
</body>

</html>
