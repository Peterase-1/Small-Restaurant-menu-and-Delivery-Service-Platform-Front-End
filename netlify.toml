[build]
  # No build command needed for static site
  command = "echo 'Static site - no build required'"
  
  # Publish directory is the root
  publish = "."
  
  # No functions directory needed
  functions = ""

[build.environment]
  # Set Node.js version (optional)
  NODE_VERSION = "18"

# Redirect rules (optional)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.m4a"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
